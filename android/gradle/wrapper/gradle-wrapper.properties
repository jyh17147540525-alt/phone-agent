# ⚠️ 这里默认指向腾讯云镜像，**不是**官方 services.gradle.org。
#
# 原因：services.gradle.org 在中国大陆基本连不上 —— 实测 curl 返回 000
# （连接直接超时），而 `./gradlew` 是 README 里给所有贡献者的第一条命令。
# 一条跑不通的命令比没有命令更糟：新人会以为是自己的环境坏了。
#
# 想换回官方（或在代理环境里）：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
# 其他可用镜像（2026-09 实测均返回 206）：
#   https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip
#   https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.13-bin.zip
#
# ⚠️ 换 URL 会让 wrapper 重新下载一次（缓存目录按 URL 哈希区分），这是预期行为。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
