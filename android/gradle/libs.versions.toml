# ══════════════════════════════════════════════════════════════
#  版本目录 —— PocketAgent
#  ⚠️ 以下版本号为 2026-09 规划值。开工前必须用 Android Studio 的
#     AGP Upgrade Assistant 与本机 SDK 实际情况校对后再锁定。
# ══════════════════════════════════════════════════════════════

[versions]
# 构建工具
agp                     = "8.13.0"
kotlin                  = "2.2.20"
ksp                     = "2.2.20-2.0.4"
hilt                    = "2.57"
detekt                  = "1.23.8"

# Android SDK
compileSdk              = "36"
targetSdk               = "36"
minSdk                  = "31"      # Android 12：平衡覆盖率与系统能力

# AndroidX 基础
coreKtx                 = "1.17.0"
appcompat               = "1.7.1"
activityCompose         = "1.11.0"
lifecycle               = "2.9.4"
composeBom              = "2026.08.00"
navigationCompose       = "2.9.5"
datastore               = "1.1.7"
room                    = "2.8.1"
workManager             = "2.10.5"
securityCrypto          = "1.1.0-alpha07"

# DI
hiltAndroidx            = "1.3.0"

# 网络与序列化
okhttp                  = "5.1.0"
retrofit                = "3.0.0"
serialization           = "1.9.0"
coroutines              = "1.10.2"

# 数据库加密
sqlcipher               = "4.9.0"
sqliteKtx               = "2.6.1"

# 系统能力
shizuku                 = "13.1.5"
mlkitTextZh             = "16.0.1"
mlkitTextEn             = "16.0.1"
mediaPipeLlm            = "0.10.24"
litertLm                = "0.9.0"

# UI 辅助
coil                    = "2.7.0"
vico                    = "2.1.2"
accompanistPermissions  = "0.37.3"

# 插件脚本运行时（L2 沙箱）—— 二选一，见方案 v2.0 决策点 D13
quickjs                 = "0.9.2"    # 体积小、启动快、可严格限制内存与超时（推荐）
rhino                   = "1.8.0"    # GKD 的选择，生态成熟，若想复用 GKD 规则生态则选它

# 测试
junit                   = "4.13.2"
junit5                  = "5.11.4"
turbine                 = "1.2.1"
mockk                   = "1.13.14"
robolectric             = "4.14.1"
androidxTestJunit       = "1.3.0"
espresso                = "3.7.0"
truth                   = "1.4.4"

# 日志
timber                  = "5.0.1"

[libraries]
# ── AndroidX 基础 ──────────────────────────────────────
androidx-core-ktx           = { module = "androidx.core:core-ktx",                       version.ref = "coreKtx" }
androidx-appcompat          = { module = "androidx.appcompat:appcompat",                 version.ref = "appcompat" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",           version.ref = "activityCompose" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service  = { module = "androidx.lifecycle:lifecycle-service",         version.ref = "lifecycle" }

# ── Compose ────────────────────────────────────────────
androidx-compose-bom        = { module = "androidx.compose:compose-bom",                 version.ref = "composeBom" }
androidx-compose-ui         = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics= { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3  = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",       version.ref = "navigationCompose" }

# ── 存储 ───────────────────────────────────────────────
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences",  version.ref = "datastore" }
androidx-room-runtime       = { module = "androidx.room:room-runtime",                   version.ref = "room" }
androidx-room-ktx           = { module = "androidx.room:room-ktx",                       version.ref = "room" }
androidx-room-compiler      = { module = "androidx.room:room-compiler",                  version.ref = "room" }
androidx-work-runtime       = { module = "androidx.work:work-runtime-ktx",               version.ref = "workManager" }
androidx-security-crypto    = { module = "androidx.security:security-crypto",            version.ref = "securityCrypto" }

# ── 数据库加密 ─────────────────────────────────────────
sqlcipher-android           = { module = "net.zetetic:sqlcipher-android",                version.ref = "sqlcipher" }
androidx-sqlite-ktx         = { module = "androidx.sqlite:sqlite-ktx",                   version.ref = "sqliteKtx" }

# ── DI ─────────────────────────────────────────────────
hilt-android                = { module = "com.google.dagger:hilt-android",               version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose     = { module = "androidx.hilt:hilt-navigation-compose",        version.ref = "hiltAndroidx" }
hilt-work                   = { module = "androidx.hilt:hilt-work",                      version.ref = "hiltAndroidx" }

# ── 网络与序列化 ───────────────────────────────────────
okhttp                      = { module = "com.squareup.okhttp3:okhttp",                  version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",     version.ref = "okhttp" }
retrofit                    = { module = "com.squareup.retrofit2:retrofit",              version.ref = "retrofit" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }

# ── 系统能力 ───────────────────────────────────────────
shizuku-api                 = { module = "dev.rikka.shizuku:api",                        version.ref = "shizuku" }
shizuku-provider            = { module = "dev.rikka.shizuku:provider",                   version.ref = "shizuku" }
mlkit-text-recognition-zh   = { module = "com.google.mlkit:text-recognition-chinese",    version.ref = "mlkitTextZh" }
mlkit-text-recognition-en   = { module = "com.google.mlkit:text-recognition",            version.ref = "mlkitTextEn" }
mediapipe-llm-inference     = { module = "com.google.mediapipe:tasks-genai",             version.ref = "mediaPipeLlm" }

# ── UI 辅助 ────────────────────────────────────────────
coil-compose                = { module = "io.coil-kt:coil-compose",                      version.ref = "coil" }
vico-compose-m3             = { module = "com.patrykandpatrick.vico:compose-m3",         version.ref = "vico" }
accompanist-permissions     = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }

# ── 日志 ───────────────────────────────────────────────
timber                      = { module = "com.jakewharton.timber:timber",                version.ref = "timber" }

# ── 插件脚本运行时（L2 沙箱）─────────────────────────────
quickjs-android             = { module = "app.cash.quickjs:quickjs-android",             version.ref = "quickjs" }
rhino-android               = { module = "com.faendir.rhino:rhino-android",              version.ref = "rhino" }

# ── 测试 ───────────────────────────────────────────────
junit                       = { module = "junit:junit",                                  version.ref = "junit" }
junit-jupiter               = { module = "org.junit.jupiter:junit-jupiter",              version.ref = "junit5" }
turbine                     = { module = "app.cash.turbine:turbine",                     version.ref = "turbine" }
mockk                       = { module = "io.mockk:mockk",                               version.ref = "mockk" }
robolectric                 = { module = "org.robolectric:robolectric",                  version.ref = "robolectric" }
truth                       = { module = "com.google.truth:truth",                       version.ref = "truth" }
androidx-test-junit         = { module = "androidx.test.ext:junit",                      version.ref = "androidxTestJunit" }
androidx-test-espresso      = { module = "androidx.test.espresso:espresso-core",         version.ref = "espresso" }

[plugins]
android-application         = { id = "com.android.application",              version.ref = "agp" }
android-library             = { id = "com.android.library",                  version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",             version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
detekt                      = { id = "io.gitlab.arturbosch.detekt",         version.ref = "detekt" }
