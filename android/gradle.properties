# ── JVM ─────────────────────────────────────────────────
#
# ⚠️ 这里**刻意不加** `-Dfile.encoding=UTF-8`。加过，然后测试全挂。
#
#    Gradle 把测试 worker 的 classpath 写进一个 `@argfile` 传给子进程。
#    写的时候用的是守护进程的 `file.encoding`；而 JVM 读 `@argfile` 用的是
#    `sun.jnu.encoding`（**平台编码**，中文 Windows 上是 GBK，且 -D 改不动）。
#
#    于是强制守护进程用 UTF-8 就制造了一个错配：
#      守护进程按 UTF-8 写  →  worker 按 GBK 读  →  路径乱码
#    而本项目的工作区路径是 `D:\手机agent开发`，含中文 —— 一乱码，
#    classpath 里的目录就找不到了，表现为**每个测试类都报
#    `ClassNotFoundException`，哪怕 .class 文件明明就在磁盘上**。
#
#    实测对照（同一个 classpath）：
#      直接传参：  D:/手机agent开发/android/...        → 加载成功
#      UTF-8 argfile：D:/鎵嬫満agent寮?鍙?/android/...  → ClassNotFoundException
#
#    JUnit 自己的 jar 在纯 ASCII 路径下（~/.gradle/caches），所以堆栈里能
#    正常看到 JUnit —— 这一点极易把人引向"测试代码有问题"的错误方向。
#
#    去掉之后，守护进程与 worker **都用平台编码**，两边一致：
#      Linux（UTF-8）        → 写 UTF-8，读 UTF-8    ✓
#      中文 Windows（GBK）   → 写 GBK，读 GBK        ✓
#    报告文件不受影响 —— Gradle 写 XML 报告时显式用 UTF-8，中文测试名正常。
#
#    **不要把它加回来。** 加回来会让 `./gradlew test` 在非 ASCII 路径下全挂，
#    而错误信息完全指不到编码问题上。
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── AndroidX ────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ── Kotlin ──────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true

# ── KSP ─────────────────────────────────────────────────
ksp.incremental=true
